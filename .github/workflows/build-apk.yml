name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "design/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "PaperLauncher-$VERSION.apk"

      - name: Write release notes
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          {
            echo "## Paper Launcher $VERSION"
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev"..HEAD
            else
              git log --no-merges --pretty='- %s' HEAD
            fi
            echo
            echo "---"
            echo "Built from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`. Install the APK, then pick Paper Launcher as your Home app."
          } > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: PaperLauncher-${{ env.VERSION }}
          path: PaperLauncher-${{ env.VERSION }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Paper Launcher ${{ env.VERSION }}
          body_path: notes.md
          prerelease: false
          make_latest: true
          files: PaperLauncher-${{ env.VERSION }}.apk

      - name: Remove old rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete build-latest --cleanup-tag --yes || true
