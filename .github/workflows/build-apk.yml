name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PaperLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaperLauncher-apk
          path: PaperLauncher.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name == 'main' && 'main' || 'latest' }}
          name: Paper Launcher (${{ github.ref_name }})
          prerelease: true
          files: PaperLauncher.apk
          body: |
            Built from ${{ github.sha }} on branch ${{ github.ref_name }}.
            Download PaperLauncher.apk on your phone, install it, then set Paper Launcher as your Home app.
